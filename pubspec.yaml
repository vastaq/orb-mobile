name: orb_mobile
description: A lightweight mobile assistant with local conversations and memory.
publish_to: none
version: 0.3.0+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  sqflite: ^2.4.6
  flutter_markdown_plus: ^1.0.12
  file_picker: ^13.4.0
  image_picker: ^1.2.4
  hooks: ^2.0.2
  native_toolchain_c: ^0.19.2
  code_assets: ^1.2.1
  record: ^7.2.0
  audioplayers: ^6.8.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  yaml: ^3.1.3
  archive: ^4.7.1
  url_launcher: ^6.3.3
  http: ^1.6.0
  crypto: ^3.0.8
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/program_runner/compiler.wasm
    - assets/program_runner/quickjs.wasm
    - assets/program_runner/sysroot.json
    - assets/program_runner/worker.js
    - assets/program_runner/THIRD_PARTY_NOTICES.txt
    - native/libfvad/LICENSE
    - native/libfvad/PATENTS
  fonts:
    - family: OrbInter
      fonts:
        - asset: assets/fonts/Inter-latin.ttf
    - family: OrbSans
      fonts:
        - asset: assets/fonts/NotoSansSC-ui.ttf
    - family: OrbSong
      fonts:
        - asset: assets/fonts/OrbSong-ui.ttf
